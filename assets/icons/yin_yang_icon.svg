  <circle cx="512" cy="512" r="358" fill="#F5F1E8" />
  
  <!-- Right Black Semi-Circle -->
  <path d="M 512,154 A 358,358 0 0,1 512,870 Z" fill="#111513" />
  
  <!-- Top Black Lobe (curves to the left) -->
  <circle cx="512" cy="333" r="179" fill="#111513" />
  
  <!-- Bottom White Lobe (curves to the right) -->

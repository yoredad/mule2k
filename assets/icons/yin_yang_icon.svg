<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#123B2D" />
  
  <!-- Outer Outline -->
  <circle cx="512" cy="512" r="362" fill="none" stroke="#09261E" stroke-width="8" />
  
  <!-- Main Symbol Body (Left is White, Right is Black) -->
